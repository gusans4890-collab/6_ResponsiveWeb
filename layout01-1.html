<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                background-color: white;
            }
            #container {
                width: 1200px;
                margin: 0 auto;

                display: flex;
                flex-wrap: wrap;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: green;
            }
            #nav {
                width: 100%;
                height: 100px;
                background-color: yellow;
            }
            #aside {
                width: 33%;
                height: 780px;
                background-color: blue;
            }
            #section {
                width: 67%;
                height: 780px;
                background-color: black;
            }
            #footer {
                width: 100%;
                height: 100px;
                background-color: green;
            }

            /* 미디어 쿼리 */
            /* 노트북, 데스크탑 */
            @media (max-width: 1300px) {
                #container {
                    width: 90%;
                }
            }

            /* 태블릿 */
            @media (max-width: 768px) {
                #container {
                    width: 100%;
                }
            }

            /* 모바일 */
            @media (max-width: 480px) {
                #aside {
                    width: 100%;
                    height: 300px;
                }
                #section {
                    width: 100%;
                    height: 100px;
                }
            }
            /*

                                    내 width값
            나의 width값의 % = ----------------------- x 100
                                컨테이너의 width 값
            */
        </style>
    </head>
    <body>
        <div id="container">
            <header id="header"></header>
            <nav id="nav"></nav>
            <aside id="aside"></aside>
            <section id="section"></section>
            <footer id="footer"></footer>
        </div>
    </body>
</html>
