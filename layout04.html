<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: red;
            }
            #nav {
                width: 100%;
                height: 100px;
                background-color: rgb(9, 235, 58);
            }
            #section {
                height: 500px;
                background-color: #3007e9;
            }
            #footer {
                height: 100px;
                background-color: #dd0b27;
            }
            .container {
                background-color: #09d2ec;
                width: 1200px;
                height: inherit;
                margin: 0 auto;
            }

            /* 노트북, 데스크탑 */
            @media (max-width: 1300px) {
                .container {
                    width: 100%;
                }
            }

            /* 태블릿 */
            @media (max-width: 768px) {
                .container {
                    width: 100%;
                }
            }

            /* 모바일 */
            @media (max-width: 480px) {
            }
        </style>
    </head>
    <body>
        <div id="header">
            <div class="container"></div>
        </div>
        <div id="nav">
            <div class="container"></div>
        </div>
        <div id="section">
            <div class="container"></div>
        </div>
        <div id="footer">
            <div class="container"></div>
        </div>
    </body>
</html>
