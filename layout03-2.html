<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>grid</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                background-color: rgb(194, 190, 190);
            }
            #container {
                width: 800px;
                margin: 0 auto;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: rgb(40, 235, 218);
            }
            #nav {
                width: 100%;
                height: 100px;
                background-color: #4862f7;
            }
            #main {
                width: 100%;
                display: grid;
                grid-template-columns: 20% 80%;
            }
            #aside {
                height: 800px;
                background-color: #98ee0e;
            }
            #section {
                display: grid;
                grid-template-columns: 50% 50%;
                grid-template-rows: 40% 30% 30%;
                grid-template-areas:
                    "article1 article1"
                    "article2 article2"
                    "article3 article3";
                background-color: #f83838;
            }
            #article1 {
                background-color: #269718;
                grid-area: article1;
            }
            #article2 {
                background-color: #1a461c;
                grid-area: article2;
            }
            #article3 {
                background-color: #338037;
                grid-area: article3;
            }

            #footer {
                background-color: #000000;
                height: 100px;
            }
            /* 데스크탑 */

            /* 노트북 */
            @media (max-width: 1300px) {
                #container {
                    width: 90%;
                }
                #section {
                    grid-template-columns: 50% 50%;
                    grid-template-rows: 50% 50%;
                    grid-template-areas:
                        "article1 article1"
                        "article2 article3";
                }
            }

            /* 태블릿 */
            @media (max-width: 768px) {
                #container {
                    width: 100%;
                }
                #section {
                    grid-template-columns: 100% 100%;
                    grid-template-rows: 50% 50%;
                    grid-template-areas:
                        "article1"
                        "article2";
                }
                #article3 {
                    display: none;
                }
            }

            /* 모바일 */
            @media (max-width: 480px) {
                #main {
                    grid-template-columns: 100%;
                }
                #aside {
                    height: 100px;
                }
                #section {
                    grid-template-columns: 100%;
                    grid-template-rows: 200px 200px;
                    grid-template-areas:
                        "article1"
                        "article2";
                }
            }
        </style>
    </head>
    <body>
        <div id="container">
            <header id="header">header</header>
            <nav id="nav">nav</nav>
            <main id="main">
                <aside id="aside">aside</aside>
                <section id="section">
                    <article1 id="article1">article111</article1>
                    <article2 id="article2">article222</article2>
                    <article3 id="article3">article333</article3>
                </section>
            </main>
            <footer id="footer">footer</footer>
        </div>
    </body>
</html>
