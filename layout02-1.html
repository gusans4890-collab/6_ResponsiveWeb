<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>레이아웃2 - flex</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                background-color: rgb(3, 243, 63);
            }
            #container {
                width: 1200px;
                margin: 0 auto;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: rgb(6, 138, 28);
            }
            #nav {
                width: 100%;
                height: 100px;
                background-color: rgb(23, 190, 121);
            }
            #main {
                width: 100%;
                background-color: #c2f704;
                display: flex;
                flex-wrap: wrap;
            }
            #aside {
                width: 30%;
                height: 780px;
                background-color: #f71212;
            }
            #section {
                width: 40%;
                height: 780px;
                background-color: #1b1feb;
            }
            #article {
                width: 30%;
                height: 780px;
                background-color: #0ea9f1;
            }
            #footer {
                width: 100%;
                height: 100px;
                background-color: #81f3c7;
            }

            /* 노트북, 데스크탑 */
            @media (max-width: 1300px) {
                #container {
                    width: 90%;
                }
            }

            /* 태블릿 */
            @media (max-width: 768px) {
                #container {
                    width: 90%;
                }
                #aside {
                    width: 40%;
                    height: 630px;
                }
                #section {
                    width: 60%;
                    height: 630px;
                }
                #article {
                    width: 100%;
                    height: 150px;
                }
            }

            /* 모바일 */
            @media (max-width: 480px) {
                #aside {
                    width: 100%;
                    height: 200px;
                }
                #section {
                    width: 100%;
                    height: 430px;
                }
            }
        </style>
    </head>
    <body>
        <div id="container">
            <header id="header"></header>
            <nav id="nav"></nav>
            <main id="main">
                <aside id="aside"></aside>
                <section id="section"></section>
                <article id="article"></article>
            </main>
            <footer id="footer"></footer>
        </div>
    </body>
</html>
