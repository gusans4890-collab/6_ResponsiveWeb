<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>레이아웃5 - flex</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            #header {
                height: 100px;
                background-color: rgb(105, 104, 104);
            }
            #nav {
                height: 100px;
                background-color: rgb(73, 75, 73);
            }
            /* #main {
            }
            .contents {
            } */
            .contents .left {
                width: 100%;
                background-color: red;
            }
            .contents .left .cont01 {
                width: 100%;
                height: 100px;
                background-color: blue;
            }
            .contents .right {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
            }
            .contents .right .cont02 {
                width: 100%;
                height: 200px;
                background-color: rgb(200, 200, 226);
            }
            .contents .right .cont03 {
                width: 50%;
                height: 480px;
                background-color: rgb(9, 163, 235);
            }
            .contents .right .cont04 {
                width: 50%;
                height: 480px;
                background-color: rgb(115, 115, 196);
            }
            #footer {
                height: 100px;
                background-color: black;
            }

            .container {
                background-color: #0000003d;
                width: 1200px;
                height: inherit;
                margin: 0 auto;
            }

            /* 노트북, 데스크탑 */
            @media (max-width: 1300px) {
                .container {
                    width: 90%;
                }
                .contents {
                    display: flex;
                    flex-wrap: wrap;
                }
                .contents .left {
                    width: 30%;
                }
                .contents .left .cont01 {
                    height: 600px;
                }
                .contents .right {
                    width: 70%;
                }
                .contents .right .cont02 {
                    height: 300px;
                }
                .contents .right .cont03 {
                    height: 300px;
                }
                .contents .right .cont04 {
                    height: 300px;
                }
            }

            /* 태블릿 */
            @media (max-width: 768px) {
                .container {
                    width: 100%;
                }
                .contents .right .cont02 {
                    height: 200px;
                }
                .contents .right .cont03 {
                    width: 100%;
                    height: 200px;
                }
                .contents .right .cont04 {
                    width: 100%;
                    height: 200px;
                }
            }

            /* 모바일 */
            @media (max-width: 480px) {
                .contents .left {
                    width: 100%;
                    height: 200px;
                }
                .contents .right {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div id="header">
            <div class="container"></div>
        </div>
        <div id="nav">
            <div class="container"></div>
        </div>
        <div id="main">
            <div class="container contents">
                <div class="left">
                    <div class="cont01"></div>
                </div>
                <div class="right">
                    <div class="cont02"></div>
                    <div class="cont03"></div>
                    <div class="cont04"></div>
                </div>
            </div>
        </div>
        <div id="footer">
            <div class="container"></div>
        </div>
    </body>
</html>
